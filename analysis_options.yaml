include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unused_import: error
    missing_return: error
  exclude:
    - build/**
    - "**/*.g.dart"
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - unawaited_futures
    - avoid_dynamic_calls
    - use_build_context_synchronously
