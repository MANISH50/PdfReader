  <g stroke="#C5CEF2" stroke-width="34" stroke-linecap="round">
    <line x1="334" y1="340" x2="520" y2="340"/>
    <line x1="334" y1="420" x2="598" y2="420"/>
    <line x1="334" y1="500" x2="470" y2="500"/>
  </g>
  <!-- reading lens -->
  <circle cx="554" cy="626" r="112" fill="#FFF4DE"/>
